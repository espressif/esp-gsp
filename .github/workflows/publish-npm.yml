name: Publish GSPC to npm

on:
  push:
    branches: [gspc-npm]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gspc-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/gspc-npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11 --ignore-scripts
      - name: Publish with OIDC
        run: |
          dist_tag="$(node --input-type=module -e "import fs from 'node:fs'; const {version} = JSON.parse(fs.readFileSync('package.json', 'utf8')); console.log(version.split('+')[0].includes('-') ? 'next' : 'latest')")"
          npm publish --access public --provenance --ignore-scripts --tag "$dist_tag"
